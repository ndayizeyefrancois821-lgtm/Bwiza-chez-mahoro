
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bwiza Chez Mahoro</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;background:#F5F5F0;margin:0}
header{background:#2C5F2D;color:white;padding:20px;text-align:center}
.card{background:white;margin:20px;padding:20px;border-radius:10px}
button{background:#2C5F2D;color:white;border:none;padding:12px;width:100%;border-radius:5px;font-size:16px}
</style>
</head>
<body>
<header><h1>Bwiza Chez Mahoro</h1><p>Bujumbura</p></header>

<div class="card">
<h2>Chambre - 10 Pi</h2>
<button onclick="pay(10,'Chambre')">Payer 10 Pi</button>
</div>

<div class="card">
<h2>Kanzu - 0.5 Pi</h2>
<button onclick="pay(0.5,'Kanzu')">Payer 0.5 Pi</button>
</div>

<div class="card">
<h2>Costume - 0.5 Pi</h2>
<button onclick="pay(0.5,'Costume')">Payer 0.5 Pi</button>
</div>

<div class="card">
<h2>Salle - 1 Pi</h2>
<button onclick="pay(1,'Salle')">Payer 1 Pi</button>
</div>

<p id="status" style="text-align:center;font-weight:bold"></p>

<script>
Pi.init({version:"2.0",sandbox:true});
async function pay(amount,name){
 const s=document.getElementById('status');
 s.innerText="Connexion...";
 try{
   await Pi.authenticate(['payments'],()=>{});
   Pi.createPayment({amount:amount,name:name},{
     onReadyForServerApproval:async(id)=>{s.innerText="Approbation...";await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})});},
     onReadyForServerCompletion:async(id,txid)=>{s.innerText="Paye "+amount+" Pi reussi!";await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txId:txid})})},
     onCancel:()=>{s.innerText="Annule";},
     onError:(e,m)=>{s.innerText="Erreur "+m.message;}
   });
 }catch(e){s.innerText=e.message;}
}
</script>
</body>
</html>
