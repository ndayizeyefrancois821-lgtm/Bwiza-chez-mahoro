<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BWIZA Chez Mahoro</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>Pi.init({ version: "2.0", sandbox: true });</script>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px;margin:0}
.card{background:white;border-radius:15px;padding:20px;margin-bottom:20px}
.btn{background:#6B21A8;color:white;padding:14px;border:none;border-radius:10px;width:100%;font-size:16px;font-weight:bold}
h1{color:#6B21A8;text-align:center}
</style>
</head>
<body>
<h1>BWIZA Chez Mahoro</h1>
<p style="text-align:center;">Kanyosha - Location Services</p>

<div class="card">
<h2>Location Salle</h2>
<p>Price: 5 Pi / day</p>
<button class="btn" onclick="payWithPi(5,'Location Salle')">Pay with Pi - 5 Pi</button>
</div>

<div class="card">
<h2>Location Pantalon</h2>
<p>Price: 0.5 Pi / day</p>
<button class="btn" onclick="payWithPi(0.5,'Location Pantalon')">Pay with Pi - 0.5 Pi</button>
</div>

<script>
async function payWithPi(amount,memo){
try{
const auth=await Pi.authenticate(['payments','username'],()=>{});
await Pi.createPayment({amount:amount,memo:"BWIZA - "+memo,metadata:{service:memo}},{
onReadyForServerApproval:function(paymentId){console.log(paymentId)},
onReadyForServerCompletion:function(paymentId,txid){alert("Payment successful! "+memo+" Tx:"+txid)},
onCancel:function(paymentId){alert("Payment cancelled")},
onError:function(error){alert("Error: "+error.message)}
});
}catch(error){alert("Error: "+error.message)}
}
</script>
</body>
</html>
